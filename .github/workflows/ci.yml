name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datenow
          POSTGRES_PASSWORD: datenow
          POSTGRES_DB: datenow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datenow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql://datenow:datenow@localhost:5432/datenow_test
      TEST_DATABASE_URL: postgresql://datenow:datenow@localhost:5432/datenow_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations apply, roll back and re-apply cleanly
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests
        run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Unit tests
        run: npx jest --ci
      - name: Bundle (iOS + Android)
        env:
          EXPO_OFFLINE: "1"
        run: npx expo export --platform ios --platform android --output-dir /tmp/expo-export

  e2e:
    # Sprint 1 vertical slice: real mobile client code against a real backend + Postgres.
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: datenow
          POSTGRES_PASSWORD: datenow
          POSTGRES_DB: datenow_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datenow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://datenow:datenow@localhost:5432/datenow_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat /tmp/uvicorn.log; exit 1
      - name: Vertical slice
        working-directory: mobile
        env:
          E2E_API_URL: http://localhost:8000
        run: |
          npm ci
          npm run test:e2e
      - name: Backend log on failure
        if: failure()
        run: cat /tmp/uvicorn.log
